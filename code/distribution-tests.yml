name: Distribution tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Delivery tests
        run: python -m unittest discover -s code/wiki-init -p 'test_*.py' -v
      - name: Updater self-check
        run: python code/wiki-init/update.py --selfcheck
      - name: Fresh installation and integrity checks
        run: python code/check_distribution.py
